name: Release

# Push a tag like v0.2.0 to build the installers and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz --title "Notes $GITHUB_REF_NAME" --generate-notes

  windows-exe:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run exe
      - name: Attach Notes.exe to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Notes-$env:GITHUB_REF_NAME-windows-x64.exe"
          Copy-Item release\Notes.exe $name
          gh release upload $env:GITHUB_REF_NAME $name --clobber
