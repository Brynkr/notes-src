name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ui:
    name: browser tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/ui/screenshots

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*.zip

  install-windows:
    name: installer (Windows)
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Install, launch, uninstall
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem *.zip).FullName -DestinationPath .
          $dir = (Get-ChildItem -Directory notes-app-*).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\installer\install.ps1" -Yes -NoLaunch
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\notes-app'
          if (-not (Test-Path "$dest\server.js")) { throw 'app not installed' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Notes.lnk'))) { throw 'no Start menu shortcut' }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\notes-app')) { throw 'no uninstall entry' }
          node "$dest\server.js" launch --no-window
          $info = Invoke-RestMethod http://127.0.0.1:4747/api/info
          if ($info.configured) { throw 'expected the setup screen on first run' }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dest\uninstall.ps1"
          Start-Sleep -Seconds 6
          if (Test-Path "$dest\server.js") { throw 'uninstall left files behind' }
          try { Invoke-RestMethod http://127.0.0.1:4747/api/info -TimeoutSec 3; throw 'server still running' } catch { 'server stopped' }

  install-unix:
    name: installer (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Install, launch, uninstall
        run: |
          unzip -q notes-app-*.zip
          cd notes-app-*/
          ./install.sh -y
          ~/.local/bin/notes-app launch --no-window
          curl -fsS http://127.0.0.1:4747/api/info
          bash -x ./uninstall.sh
          sleep 2
          ! curl -fsS --max-time 3 http://127.0.0.1:4747/api/info

  exe-windows:
    name: portable Notes.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run exe
      - name: Run the exe like a user would, then set up, write and sync a note
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item release\Notes.exe portable\Notes.exe
          $exe = (Resolve-Path portable\Notes.exe).Path
          # Windowed app (no console): subsystem byte must be 2.
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $pe + 24 + 68) -ne 2) { throw 'exe is not a windowed app' }
          Start-Process $exe -ArgumentList '--no-window'
          $info = $null
          for ($i = 0; $i -lt 40 -and -not $info; $i++) { Start-Sleep -Milliseconds 500; try { $info = Invoke-RestMethod http://127.0.0.1:4747/api/info } catch {} }
          if (-not $info) { Get-Content portable\Notes-data\data\notes-app.log -ErrorAction SilentlyContinue; throw 'server did not start' }
          if ($info.configured) { throw 'expected first-run setup' }
          if (-not ((Invoke-WebRequest http://127.0.0.1:4747/ -UseBasicParsing).Content -match 'app.js')) { throw 'web UI not served from the exe' }
          if ((Invoke-WebRequest http://127.0.0.1:4747/app.js -UseBasicParsing).StatusCode -ne 200) { throw 'app.js missing' }
          if (-not (Test-Path portable\Notes-data\data\notes-app.log)) { throw 'portable data folder not used' }
          # First-run setup against a scratch "GitHub" repo, then a note, then sync.
          git init -q --bare -b main remote.git
          $remote = (Resolve-Path remote.git).Path
          $h = @{ 'X-Notes-App' = '1' }
          $body = @{ repoPath = (Join-Path $PWD 'MyNotes'); remoteUrl = $remote; machineName = 'ci-windows' } | ConvertTo-Json
          Invoke-RestMethod -Method Post http://127.0.0.1:4747/api/setup -Headers $h -ContentType 'application/json' -Body $body | Out-Null
          $note = Invoke-RestMethod -Method Post http://127.0.0.1:4747/api/notes -Headers $h -ContentType 'application/json' -Body '{"title":"Hello from Windows"}'
          $status = Invoke-RestMethod -Method Post http://127.0.0.1:4747/api/sync -Headers $h -ContentType 'application/json' -Body '{}'
          if ($status.state -ne 'synced') { throw "sync state: $($status.state) $($status.message)" }
          $files = git -C $remote ls-tree --name-only main
          if (-not ($files -match 'hello-from-windows')) { throw "note not pushed: $files" }
          Start-Process $exe -ArgumentList 'stop' -Wait
          Start-Sleep -Seconds 3
          try { Invoke-RestMethod http://127.0.0.1:4747/api/info -TimeoutSec 3; throw 'still running' } catch { if ($_.Exception.Message -eq 'still running') { throw } }
          'Notes.exe works: ' + (Get-Item $exe).Length / 1MB + ' MB'
      - uses: actions/upload-artifact@v4
        with:
          name: Notes-windows-exe
          path: release/Notes.exe
